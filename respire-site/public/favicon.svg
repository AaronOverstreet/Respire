<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="4" y1="3" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#087EAC"/>
      <stop offset="1" stop-color="#145B78"/>
    </linearGradient>
    <linearGradient id="center" x1="12" y1="11" x2="20" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FF6D45"/>
    </linearGradient>
  </defs>

  <!-- A solid field keeps the mark legible against both light and dark browser chrome. -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#bg)"/>
  <rect x="1.75" y="1.75" width="28.5" height="28.5" rx="6.75" stroke="#BDEEFF" stroke-opacity=".72" stroke-width="1.5"/>

  <!-- Simplified flower-of-life geometry, drawn heavily enough to survive at 16px. -->
  <g stroke="#FFFFFF" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="5.25"/>
    <circle cx="16" cy="10.75" r="5.25"/>
    <circle cx="20.55" cy="13.38" r="5.25"/>
    <circle cx="20.55" cy="18.62" r="5.25"/>
    <circle cx="16" cy="21.25" r="5.25"/>
    <circle cx="11.45" cy="18.62" r="5.25"/>
    <circle cx="11.45" cy="13.38" r="5.25"/>
  </g>
  <circle cx="16" cy="16" r="2.35" fill="url(#center)" stroke="#FFFFFF" stroke-width=".85"/>
</svg>
